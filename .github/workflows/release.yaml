name: goreleaser

on:
  push:
    tags:
      - 'v*-plus.*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh models catalog
        run: |
          git fetch --depth 1 https://github.com/router-for-me/models.git main
          git show FETCH_HEAD:models.json > internal/registry/models/models.json
      - run: git fetch --force --tags
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate Build Metadata
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo COMMIT=`git rev-parse --short HEAD` >> $GITHUB_ENV
          echo BUILD_DATE=`date -u +%Y-%m-%dT%H:%M:%SZ` >> $GITHUB_ENV
      - uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --clean --skip=validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
          COMMIT: ${{ env.COMMIT }}
          BUILD_DATE: ${{ env.BUILD_DATE }}
      - name: Trigger homebrew-tap update
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HTTP_CODE=$(curl -sL -w "%{http_code}" -o /tmp/homebrew-dispatch-response.json \
            -X POST \
            -H "Authorization: token ${{ secrets.TAP_GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/nguyenphutrong/homebrew-tap/dispatches \
            -d "{\"event_type\":\"cpa-plusplus-release\",\"client_payload\":{\"version\":\"${VERSION}\"}}")

          if [ "$HTTP_CODE" != "204" ]; then
            cat /tmp/homebrew-dispatch-response.json
            echo "::error::Failed to trigger homebrew-tap update. HTTP status: $HTTP_CODE"
            exit 1
          fi
