services:
  cpa-plusplus:
    image: ${CPA_PLUSPLUS_IMAGE:-ghcr.io/nguyenphutrong/cpa-plusplus:latest}
    pull_policy: always
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cpa-plusplus-cluster
    environment:
      HOME_JWT: ${HOME_JWT:-}
    ports:
      - "8317:8317"
    volumes:
      - ./home:/root/.cli-proxy-api
      - ./logs:/cpa-plusplus/logs
    command: >
      sh -eu -c '
        if [ -z "$$HOME_JWT" ]; then
          echo "HOME_JWT is required" >&2
          exit 1
        fi

        exec ./cpa-plusplus -home-jwt "$$HOME_JWT"
      '
    restart: unless-stopped
