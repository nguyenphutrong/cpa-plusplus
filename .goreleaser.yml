version: 2

project_name: cpa-plusplus

builds:
  - id: "cpa-plusplus"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    main: ./cmd/server/
    binary: cpa-plusplus
    ldflags:
      - -s -w -X 'main.Version={{.Version}}' -X 'main.Commit={{.ShortCommit}}' -X 'main.BuildDate={{.Date}}'
archives:
  - id: "cpa-plusplus"
    format: tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{- if eq .Arch "arm64" -}}aarch64{{- else -}}{{ .Arch }}{{- end -}}
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - config.example.yaml

checksum:
  name_template: 'checksums.txt'

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

brews:
  - name: cpa-plusplus
    repository:
      owner: nguyenphutrong
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    description: "OpenAI/Gemini/Claude/Codex compatible API proxy with OAuth and round-robin load balancing"
    homepage: "https://github.com/nguyenphutrong/cpa-plusplus"
    license: "MIT"
    install: |
      bin.install "cpa-plusplus"
    test: |
      assert_match version.to_s, shell_output("#{bin}/cpa-plusplus --version")
    skip_upload: false
    dependencies:
      - name: git
        type: optional
